<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akademik AI Asistan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <div class="container">
            <header class="header">
                <h1>🌌 Akademik AI Asistan</h1>
                <p>Sayın Komutanım, sorularınızı yazın ve yanıtları görün.</p>
            </header>
            
            <main class="chat-window" id="chatWindow">
                <!-- Mesajlar buraya gelecek -->
            </main>

            <div id="typingIndicator" class="typing-indicator">🤖 AI yazıyor...</div>
            
            <footer class="input-area">
                <input type="text" id="userInput" placeholder="Sorunuzu yazın..." autofocus>
                <button id="sendBtn">Gönder</button>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        function addMessage(content, sender){
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + sender;
            msgDiv.innerHTML = content;
            chatWindow.appendChild(msgDiv);
            msgDiv.scrollIntoView({behavior: "smooth"});
        }

        function showTypingIndicator(show){
            typingIndicator.style.display = show ? 'block' : 'none';
        }

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if(!text) return;
            addMessage(text, 'user');
            userInput.value = '';
            showTypingIndicator(true);
            setTimeout(() => {
                const response = generateAIResponse(text);
                addMessage(response, 'ai');
                showTypingIndicator(false);
            }, 600);
        });

        userInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
